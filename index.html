<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartInvestor AI - Investment Dashboard</title>
  
  <!-- React Libraries -->
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* ═══════════════════════════════════════════════════════════
       RESET & BASE STYLES
    ═══════════════════════════════════════════════════════════ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, #root {
      width: 100%;
      height: 100%;
    }

    body {
      background: #060d1a;
    }

    /* ═══════════════════════════════════════════════════════════
       ANIMATIONS
    ═══════════════════════════════════════════════════════════ */
    @keyframes matrixFall {
      0% { transform: translateY(-100%); opacity: 0; }
      5% { opacity: 1; }
      85% { opacity: 0.6; }
      100% { transform: translateY(110vh); opacity: 0; }
    }

    @keyframes tickerMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    @keyframes revealUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shimmer {
      0% { background-position: 0% center; }
      100% { background-position: 300% center; }
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.75); }
    }

    @keyframes dotBounce {
      0%, 100% { opacity: 0.25; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ═══════════════════════════════════════════════════════════
       ANIMATION UTILITIES
    ═══════════════════════════════════════════════════════════ */
    .r1 { animation: revealUp 0.7s ease 0.05s both; }
    .r2 { animation: revealUp 0.7s ease 0.18s both; }
    .r3 { animation: revealUp 0.7s ease 0.30s both; }
    .r4 { animation: revealUp 0.7s ease 0.42s both; }
    .r5 { animation: revealUp 0.7s ease 0.54s both; }
    .r6 { animation: revealUp 0.7s ease 0.66s both; }
    .r7 { animation: revealUp 0.7s ease 0.78s both; }

    /* ═══════════════════════════════════════════════════════════
       GRADIENT TEXT
    ═══════════════════════════════════════════════════════════ */
    .hl {
      background: linear-gradient(90deg, #10b981, #60a5fa, #a78bfa, #f59e0b, #10b981, #34d399);
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 7s linear infinite;
    }

    /* ═══════════════════════════════════════════════════════════
       COMPONENT STYLES
    ═══════════════════════════════════════════════════════════ */
    .stat-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(16, 185, 129, 0.12) !important;
    }

    .cta-main {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      cursor: pointer;
      transition: all 0.22s ease;
    }

    .cta-main:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 40px rgba(16, 185, 129, 0.45);
      background: linear-gradient(135deg, #0fd49a, #10b981);
    }

    .cta-out {
      font-family: 'Syne', sans-serif;
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: all 0.22s ease;
      backdrop-filter: blur(12px);
    }

    .cta-out:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.3);
      color: #fff;
    }

    .nav-pill {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      background: transparent;
      border: 1px solid transparent;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: color 0.18s, background 0.18s;
      border-radius: 20px;
      padding: 5px 14px;
    }

    .nav-pill:hover {
      color: rgba(255, 255, 255, 0.88);
    }

    .nav-pill.active {
      background: rgba(16, 185, 129, 0.13);
      border-color: rgba(16, 185, 129, 0.35);
      color: #10b981;
    }

    .feature-pill {
      transition: border-color 0.2s, transform 0.2s;
    }

    .feature-pill:hover {
      border-color: rgba(16, 185, 129, 0.35) !important;
      transform: translateY(-2px);
    }

    .opp-card {
      transition: transform 0.18s, box-shadow 0.18s;
    }

    .opp-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(16, 185, 129, 0.08);
    }

    .tab-btn {
      transition: all 0.15s;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.04) !important;
    }

    .alert-row {
      transition: all 0.15s;
    }

    .alert-row:hover {
      background: rgba(255, 255, 255, 0.02) !important;
    }

    /* ═══════════════════════════════════════════════════════════
       MODAL STYLES
    ═══════════════════════════════════════════════════════════ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }

    .modal-box {
      background: #0f1929;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 16px;
      padding: 28px 32px;
      width: 100%;
      max-width: 480px;
      animation: popIn 0.22s ease;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.6);
    }

    .research-modal {
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
    }

    /* ═══════════════════════════════════════════════════════════
       FORM STYLES
    ═══════════════════════════════════════════════════════════ */
    input:focus,
    textarea:focus,
    select:focus {
      outline: none !important;
      border-color: rgba(16, 185, 129, 0.45) !important;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.08) !important;
    }

    /* ═══════════════════════════════════════════════════════════
       SCROLLBAR STYLES
    ═══════════════════════════════════════════════════════════ */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 4px;
    }

    /* ═══════════════════════════════════════════════════════════
       FONTS
    ═══════════════════════════════════════════════════════════ */
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Storage API Initialization -->
  <script>
    window.storage = {
      set: async (key, value) => {
        localStorage.setItem(key, value);
        return Promise.resolve();
      },
      get: async (key) => {
        const value = localStorage.getItem(key);
        return value ? { value } : null;
      },
      delete: async (key) => {
        localStorage.removeItem(key);
        return Promise.resolve();
      }
    };
  </script>

  <!-- Main Application -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    /* ═══════════════════════════════════════════════════════════
       DESIGN TOKENS & CONSTANTS
    ═══════════════════════════════════════════════════════════ */

    // Color Palette
    const T = {
      green:  "#10b981",
      greenD: "#059669",
      greenL: "#34d399",
      gold:   "#f59e0b",
      red:    "#ef4444",
      blue:   "#3b82f6",
      purple: "#8b5cf6",
      muted:  "#94a3b8",
      border: "rgba(148,163,184,0.11)",
      card:   "#0f1929",
      cardH:  "#162035",
      bg:     "#060d1a",
    };

    // Portfolio Data
    const PORTFOLIO_INIT = [
      { id:1, name:"TCS",             type:"Stock",       sector:"IT",      value:125000, alloc:25, chg:2.4,  sig:"HOLD" },
      { id:2, name:"HDFC Bank",       type:"Stock",       sector:"Finance", value:95000,  alloc:19, chg:1.1,  sig:"BUY"  },
      { id:3, name:"Reliance",        type:"Stock",       sector:"Energy",  value:80000,  alloc:16, chg:-0.8, sig:"HOLD" },
      { id:4, name:"Infosys",         type:"Stock",       sector:"IT",      value:70000,  alloc:14, chg:3.2,  sig:"BUY"  },
      { id:5, name:"SBI Bluechip MF", type:"Mutual Fund", sector:"Equity",  value:60000,  alloc:12, chg:1.8,  sig:"BUY"  },
      { id:6, name:"Axis ELSS",       type:"Mutual Fund", sector:"ELSS",    value:40000,  alloc:8,  chg:2.1,  sig:"HOLD" },
      { id:7, name:"Gold Bond",       type:"Bond",        sector:"Gold",    value:30000,  alloc:6,  chg:0.5,  sig:"HOLD" },
    ];

    // Opportunities Data
    const OPPS_INIT = [
      { id:1, name:"Zomato",        type:"Stock", reason:"Bullish breakout above 200-day MA. Food delivery volumes up 34% QoQ.", sig:"BUY",       target:"₹230",   up:"+18%",       risk:"Medium", sector:"Consumer",  watchlisted:false },
      { id:2, name:"Bajaj Finance", type:"Stock", reason:"Strong NIM expansion. Q3 PAT beat by 8%. Loan book growing.",         sig:"BUY",       target:"₹8,200", up:"+12%",       risk:"Low",    sector:"NBFC",      watchlisted:false },
      { id:3, name:"Navi Nifty ETF",type:"ETF",  reason:"Lowest expense ratio 0.06%. Good entry post correction.",              sig:"ACCUMULATE",target:"SIP",    up:"Index",      risk:"Low",    sector:"Index",     watchlisted:false },
      { id:4, name:"RVNL IPO",      type:"IPO",  reason:"Order book ₹75,000 Cr. PSU infra play. 3�  oversubscribed.",           sig:"SUBSCRIBE", target:"₹620",   up:"+22%",       risk:"Medium", sector:"Infra",     watchlisted:false },
      { id:5, name:"Mirae ELSS",    type:"MF",   reason:"Tax saving + wealth. 5Y CAGR 18.2%. Top 3 in category.",               sig:"INVEST",    target:"SIP",    up:"Tax+Returns",risk:"Medium", sector:"ELSS",      watchlisted:false },
    ];

    // Alerts Data
    const ALERTS_INIT = [
      { id:1, type:"warning",     title:"Portfolio Concentration Risk", msg:"IT sector now 39% of portfolio. Recommended max: 25%.",             time:"2 min ago",  read:false },
      { id:2, type:"opportunity", title:"HDFC Bank Breakout",           msg:"HDFC Bank crossed ₹1,750 resistance with high volume.",            time:"18 min ago", read:false },
      { id:3, type:"info",        title:"Nifty 50 hits 52-week high",   msg:"Index at 23,850. Your portfolio is up ₹12,400 today (+2.1%).",     time:"45 min ago", read:true  },
      { id:4, type:"success",     title:"Tax Saving Reminder",          msg:"₹90,000 more in ELSS needed to maximise Section 80C benefit.",     time:"2 hrs ago",  read:true  },
      { id:5, type:"warning",     title:"SIP Date Tomorrow",            msg:"Your ₹5,000 SIP in SBI Bluechip will be debited tomorrow.",        time:"5 hrs ago",  read:true  },
    ];

    // Market Data
    const TICKER_DATA = [
      { s:"NIFTY 50",  v:"23,850.40", c:"+1.20%",positive:true  },
      { s:"SENSEX",    v:"78,553.20", c:"+0.89%",positive:true  },
      { s:"TCS",       v:"4,182.55",  c:"+2.40%",positive:true  },
      { s:"RELIANCE",  v:"2,941.30",  c:"-0.81%",positive:false },
      { s:"HDFC BANK", v:"1,762.10",  c:"+1.12%",positive:true  },
      { s:"INFOSYS",   v:"1,890.75",  c:"+3.20%",positive:true  },
      { s:"BAJFIN",    v:"7,310.00",  c:"+0.65%",positive:true  },
      { s:"ITC",       v:"441.20",    c:"+0.38%",positive:true  },
      { s:"WIPRO",     v:"462.35",    c:"-0.44%",positive:false },
      { s:"GOLD",      v:"₹71,200",   c:"+0.50%",positive:true  },
      { s:"USD/INR",   v:"83.47",     c:"-0.11%",positive:false },
      { s:"NIFTY IT",  v:"36,420",    c:"+2.10%",positive:true  },
    ];

    // AI System Prompt
    const AI_SYS = `You are the Smart Investor AI   a multi-agent system for Indian retail investors. 5 agents: Data, Analysis, Decision, Explanation, Alert. Always respond as an Indian retail investor's advisor. Use ₹. Reference NSE/BSE, mutual funds, tax rules (80C, LTCG, STCG), SEBI regulations. Be conversational, avoid jargon. Give specific actionable advice in 3-5 sentences max. Use bullet points for lists.`;

    /* ═══════════════════════════════════════════════════════════
       UTILITY COMPONENTS - Primitives
    ═══════════════════════════════════════════════════════════ */

    // Base Card Component
    const Card = ({ children, style={}, glow, onClick, className="" }) => (
      <div className={className} onClick={onClick} style={{ background:T.card,border:`1px solid ${T.border}`,borderRadius:14,padding:20,boxShadow:glow?`0 0 0 1px ${T.green}28,0 8px 32px rgba(16,185,129,.05)`:"none",transition:"all .2s",cursor:onClick?"pointer":"default",...style }}>{children}</div>
    );

    // Metric Card Component
    const MetricCard = ({ label, value, sub, color, icon, trend }) => (
      <Card style={{ padding:"16px 20px" }}>
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start" }}>
          <div>
            <p style={{ color:T.muted,fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:".8px",marginBottom:6,fontFamily:"'JetBrains Mono',monospace" }}>{label}</p>
            <p style={{ color:"white",fontSize:24,fontWeight:700,letterSpacing:"-1px",marginBottom:2,fontFamily:"'Cormorant Garamond',serif" }}>{value}</p>
            {sub && <p style={{ color:trend==="up"?T.green:trend==="down"?T.red:T.muted,fontSize:12 }}>{sub}</p>}
          </div>
          <div style={{ width:40,height:40,borderRadius:10,background:`${color||T.green}1e`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18 }}>{icon}</div>
        </div>
      </Card>
    );

    // Signal Badge
    const SigBadge = ({ signal }) => {
      const MAP = { BUY:{bg:"rgba(16,185,129,.14)",c:T.green},SELL:{bg:"rgba(239,68,68,.14)",c:T.red},HOLD:{bg:"rgba(245,158,11,.14)",c:T.gold},ACCUMULATE:{bg:"rgba(59,130,246,.14)",c:T.blue},SUBSCRIBE:{bg:"rgba(139,92,246,.14)",c:T.purple},INVEST:{bg:"rgba(16,185,129,.14)",c:T.green} };
      const s = MAP[signal]||MAP.HOLD;
      return <span style={{ background:s.bg,color:s.c,fontSize:10,fontWeight:700,padding:"3px 8px",borderRadius:6,letterSpacing:".5px",fontFamily:"'JetBrains Mono',monospace" }}>{signal}</span>;
    };

    // Alert Icon
    const AlertIcon = ({ type }) => {
      const MAP = { warning:{ic:"",c:T.gold,bg:"rgba(245,158,11,.1)"},opportunity:{ic:"",c:T.green,bg:"rgba(16,185,129,.1)"},info:{ic:"",c:T.blue,bg:"rgba(59,130,246,.1)"},success:{ic:"",c:T.green,bg:"rgba(16,185,129,.1)"} };
      const s = MAP[type]||MAP.info;
      return <div style={{ width:32,height:32,borderRadius:8,background:s.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:s.c,flexShrink:0 }}>{s.ic}</div>;
    };

    // Risk Gauge
    const RiskGauge = ({ score }) => {
      const ang = (score/100)*180-90;
      const col = score<35?T.green:score<65?T.gold:T.red;
      const lbl = score<35?"Conservative":score<65?"Moderate":"Aggressive";
      return (
        <div style={{ textAlign:"center" }}>
          <svg viewBox="0 0 200 110" style={{ width:"100%",maxWidth:220 }}>
            <defs><linearGradient id="rg2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stopColor={T.green}/><stop offset="50%" stopColor={T.gold}/><stop offset="100%" stopColor={T.red}/></linearGradient></defs>
            <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="url(#rg2)" strokeWidth="14" strokeLinecap="round"/>
            <line x1="100" y1="100" x2={100+60*Math.cos((ang*Math.PI)/180)} y2={100+60*Math.sin((ang*Math.PI)/180)} stroke={col} strokeWidth="3" strokeLinecap="round"/>
            <circle cx="100" cy="100" r="6" fill={col}/>
            <text x="100" y="80" textAnchor="middle" fill="white" fontSize="20" fontWeight="700">{score}</text>
            <text x="100" y="95" textAnchor="middle" fill={T.muted} fontSize="9">RISK SCORE</text>
          </svg>
          <p style={{ color:col,fontSize:13,fontWeight:600,marginTop:-8,fontFamily:"'Syne',sans-serif" }}>{lbl} Risk</p>
        </div>
      );
    };

    // Database Status Badge
    const DbBadge = ({ status }) => {
      const cfg = {
        loading:{ c:"#64748b", label:"DB ",     dot:"#64748b" },
        ok:     { c:T.green,   label:"DB Synced", dot:T.green  },
        error:  { c:T.gold,    label:"DB Offline (in-memory)", dot:T.gold },
      }[status] || { c:T.gold, label:"DB ?", dot:T.gold };
      return (
        <div style={{ display:"flex",alignItems:"center",gap:5,background:"rgba(255,255,255,.04)",border:`1px solid ${cfg.dot}28`,borderRadius:12,padding:"3px 9px",cursor:"default" }} title="Persistent storage status">
          <div style={{ width:5,height:5,borderRadius:"50%",background:cfg.dot,animation:status==="ok"?"livePulse 3s infinite":"none" }}/>
          <span style={{ color:cfg.c,fontSize:9.5,fontWeight:600,fontFamily:"'JetBrains Mono',monospace",letterSpacing:".5px" }}>{cfg.label}</span>
        </div>
      );
    };

    // Modal Component
    const Modal = ({ title, onClose, children, wide }) => (
      <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div className={`modal-box${wide?" research-modal":""}`} style={{ fontFamily:"'Syne',sans-serif" }}>
          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20 }}>
            <h2 style={{ color:"white",fontSize:18,fontWeight:700,fontFamily:"'Cormorant Garamond',serif" }}>{title}</h2>
            <button onClick={onClose} style={{ background:"transparent",border:"none",color:T.muted,fontSize:20,cursor:"pointer",lineHeight:1,padding:"0 4px" }}></button>
          </div>
          {children}
        </div>
      </div>
    );

    /* ═══════════════════════════════════════════════════════════
       VISUAL EFFECTS COMPONENTS
    ═══════════════════════════════════════════════════════════ */

    // Matrix Rain Background
    const MatrixRain = () => {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current; if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const resize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
        resize(); window.addEventListener("resize", resize);
        const CHARS = "₹%+-.0123456789ABCNSX� �SIPNSEBTSETF";
        let cols = Math.floor(canvas.width / 20);
        let drops = Array.from({ length: cols }, () => Math.random() * -40);
        const speeds = Array.from({ length: cols }, () => .22 + Math.random() * .5);
        let raf;
        const draw = () => {
          ctx.fillStyle = "rgba(6,13,26,.14)"; ctx.fillRect(0,0,canvas.width,canvas.height);
          cols = Math.floor(canvas.width / 20);
          while (drops.length < cols) { drops.push(0); speeds.push(.3 + Math.random() * .4); }
          for (let i = 0; i < cols; i++) {
            const ch = CHARS[Math.floor(Math.random() * CHARS.length)];
            ctx.font = `${10 + Math.floor(Math.random()*4)}px 'JetBrains Mono',monospace`;
            ctx.fillStyle = `rgba(16,185,129,${.12 + Math.random()*.5})`;
            ctx.fillText(ch, i*20, drops[i]*20);
            if (drops[i]*20 > canvas.height && Math.random() > .977) drops[i] = 0;
            drops[i] += speeds[i];
          }
          raf = requestAnimationFrame(draw);
        };
        draw();
        return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", resize); };
      }, []);
      return <canvas ref={canvasRef} style={{ position:"absolute",inset:0,width:"100%",height:"100%",display:"block" }}/>;
    };

    // Ticker Strip
    const TickerStrip = () => {
      const items = [...TICKER_DATA, ...TICKER_DATA, ...TICKER_DATA];
      return (
        <div style={{ position:"relative",height:34,overflow:"hidden",background:"rgba(5,12,22,.9)",backdropFilter:"blur(16px)",borderBottom:"1px solid rgba(16,185,129,.15)",display:"flex",alignItems:"center",zIndex:20 }}>
          <div style={{ position:"absolute",left:0,top:0,bottom:0,width:48,background:"linear-gradient(90deg,rgba(5,12,22,1),transparent)",zIndex:2,pointerEvents:"none" }}/>
          <div style={{ position:"absolute",right:0,top:0,bottom:0,width:48,background:"linear-gradient(270deg,rgba(5,12,22,1),transparent)",zIndex:2,pointerEvents:"none" }}/>
          <div style={{ display:"flex",animation:"tickerMove 36s linear infinite",whiteSpace:"nowrap",willChange:"transform" }}>
            {items.map((t,i) => (
              <span key={i} style={{ display:"inline-flex",alignItems:"center",gap:6,padding:"0 18px",fontFamily:"'JetBrains Mono',monospace",fontSize:11 }}>
                <span style={{ color:"rgba(148,163,184,.55)",letterSpacing:".5px",fontSize:9.5 }}>{t.s}</span>
                <span style={{ color:"rgba(255,255,255,.85)",fontWeight:500 }}>{t.v}</span>
                <span style={{ color:t.positive?T.green:T.red,fontWeight:700 }}>{t.c}</span>
                <span style={{ color:"rgba(148,163,184,.15)",fontSize:16 }}>·</span>
              </span>
            ))}
          </div>
        </div>
      );
    };

    /* ═══════════════════════════════════════════════════════════
       CHART COMPONENTS
    ═══════════════════════════════════════════════════════════ */

    // Donut Chart

          if (!window.Chart) return setTimeout(load,100);
          if (inst.current) inst.current.destroy();
          inst.current = new window.Chart(ref.current, { type:"doughnut", data:{ labels:data.map(d=>d.name), datasets:[{ data:data.map(d=>d.alloc), backgroundColor:["#10b981","#3b82f6","#f59e0b","#8b5cf6","#ef4444","#06b6d4","#ec4899"], borderWidth:0, borderRadius:3, hoverOffset:6 }] }, options:{ responsive:true,maintainAspectRatio:false,cutout:"68%",plugins:{ legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.label}: ${c.raw}%`}} } } });

            <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14 }}>
              <p style={{ color:T.muted,fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:".8px",fontFamily:"'JetBrains Mono',monospace" }}>12-Month Performance</p>
              <div style={{ display:"flex",gap:14 }}>
                {[["Portfolio",T.green],["Nifty 50",T.blue]].map(([l,c])=>(
                  <span key={l} style={{ display:"flex",alignItems:"center",gap:5,fontSize:11,color:T.muted }}>
                    <span style={{ width:18,height:2,background:c,display:"inline-block" }}/>{l}
                  </span>
                ))}
              </div>
            </div>
            <LineChart/>
            <div style={{ display:"flex",justifyContent:"space-around",marginTop:14,padding:"12px 0",borderTop:`1px solid ${T.border}` }}>
              {[["Portfolio Return","+18.4%",T.green],["Nifty 50 Return","+12.2%",T.blue],["Alpha Generated","+6.2%",T.gold],["Sharpe Ratio","1.42","white"]].map(([l,v,c])=>(
                <div key={l} style={{ textAlign:"center" }}>
                  <p style={{ color:T.muted,fontSize:11,marginBottom:3 }}>{l}</p>
                  <p style={{ color:c,fontSize:16,fontWeight:700,fontFamily:"'Cormorant Garamond',serif" }}>{v}</p>
                </div>
              ))}
            </div>
          </Card>
          <div>
            <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12 }}>
              <p style={{ color:T.muted,fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:".8px",fontFamily:"'JetBrains Mono',monospace" }}>Recent Alerts</p>
              <button onClick={()=>setTab("alerts")} style={{ background:"transparent",border:"none",color:T.green,fontSize:12,cursor:"pointer",fontFamily:"'Syne',sans-serif" }}>View all →</button>
            </div>
            <div style={{ display:"flex",flexDirection:"column",gap:7 }}>
              {alerts.slice(0,3).map(a=>(
                <Card key={a.id} style={{ padding:"11px 15px",display:"flex",alignItems:"center",gap:11 }}>
                  <AlertIcon type={a.type}/>
                  <div style={{ flex:1 }}>
                    <p style={{ color:"white",fontSize:13,fontWeight:500 }}>{a.title}</p>
                    <p style={{ color:T.muted,fontSize:12,marginTop:1 }}>{a.msg}</p>
                  </div>
                  <span style={{ color:T.muted,fontSize:11,flexShrink:0,fontFamily:"'JetBrains Mono',monospace" }}>{a.time}</span>
                  {!a.read && <span style={{ width:7,height:7,borderRadius:"50%",background:T.green,flexShrink:0 }}/>}
                </Card>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // Portfolio (Placeholder - continue with similar structure)
    const Portfolio = ({ portfolio, setPortfolio }) => (
      <div style={{ padding:24,fontFamily:"'Syne',sans-serif",color:"white" }}>
        <h1>Portfolio Page</h1>
        <p>Portfolio analyzer and management interface</p>
      </div>
    );

    // Chat (Placeholder)
    const Chat = ({ profile, chatMsgs, setChatMsgs }) => (
      <div style={{ padding:24,fontFamily:"'Syne',sans-serif",color:"white" }}>
        <h1>AI Chat</h1>
        <p>Chat with investment advisor AI</p>
      </div>
    );

    // Radar (Placeholder)
    const Radar = ({ opps, setOpps, setTab }) => (
      <div style={{ padding:24,fontFamily:"'Syne',sans-serif",color:"white" }}>
        <h1>Market Radar</h1>
        <p>Real-time opportunities and signals</p>
      </div>
    );

    // Alerts Page (Placeholder)
    const AlertsPage = ({ alerts, setAlerts }) => (
      <div style={{ padding:24,fontFamily:"'Syne',sans-serif",color:"white" }}>
        <h1>Alerts</h1>
        <p>All your investment alerts</p>
      </div>
    );

    /* ═══════════════════════════════════════════════════════════
       HOOKS & STATE MANAGEMENT
    ═══════════════════════════════════════════════════════════ */

    function useDB() {
      const [dbReady, setDbReady] = useState(false);
      const [profile,  _setProfile]  = useState(null);
      const [portfolio,_setPortfolio] = useState(PORTFOLIO_INIT);
      const [alerts,   _setAlerts]   = useState(ALERTS_INIT);
      const [opps,     _setOpps]     = useState(OPPS_INIT);
      const [chatMsgs, _setChatMsgs] = useState([]);
      const [screen,   _setScreen]   = useState("landing");
      const [tab,      _setTab]      = useState("dashboard");
      const [dbStatus, setDbStatus]  = useState("loading");

      const save = useCallback(async (key, value) => {
        try { await window.storage.set(key, JSON.stringify(value)); } catch(e) { console.warn("DB save error", key, e); }
      }, []);

      const load = useCallback(async (key, fallback) => {
        try {
          const r = await window.storage.get(key);
          return r ? JSON.parse(r.value) : fallback;
        } catch { return fallback; }
      }, []);

      useEffect(() => {
        (async () => {
          try {
            const [p, port, al, op, chat, sc, tb] = await Promise.all([
              load("si:profile",   null),
              load("si:portfolio", PORTFOLIO_INIT),
              load("si:alerts",    ALERTS_INIT),
              load("si:opps",      OPPS_INIT),
              load("si:chat",      []),
              load("si:screen",    "landing"),
              load("si:tab",       "dashboard"),
            ]);
            _setProfile(p);
            _setPortfolio(port);
            _setAlerts(al);
            _setOpps(op);
            _setChatMsgs(chat);
            _setScreen(sc === "app" && p ? "app" : p ? "app" : sc);
            _setTab(tb);
            setDbStatus("ok");
          } catch(e) {
            console.warn("DB boot error", e);
            setDbStatus("error");
          } finally {
            setDbReady(true);
          }
        })();
      }, []);

      const setProfile = useCallback((p) => {
        const val = typeof p === "function" ? p(null) : p;
        _setProfile(val);
        save("si:profile", val);
      }, [save]);

      const setPortfolio = useCallback((updater) => {
        _setPortfolio(prev => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          save("si:portfolio", next);
          return next;
        });
      }, [save]);

      const setAlerts = useCallback((updater) => {
        _setAlerts(prev => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          save("si:alerts", next);
          return next;
        });
      }, [save]);

      const setOpps = useCallback((updater) => {
        _setOpps(prev => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          save("si:opps", next);
          return next;
        });
      }, [save]);

      const setChatMsgs = useCallback((updater) => {
        _setChatMsgs(prev => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          const trimmed = next.slice(-80);
          save("si:chat", trimmed);
          return trimmed;
        });
      }, [save]);

      const setScreen = useCallback((s) => {
        _setScreen(s);
        save("si:screen", s);
      }, [save]);

      const setTab = useCallback((t) => {
        _setTab(t);
        save("si:tab", t);
      }, [save]);

      const resetAll = useCallback(async () => {
        try {
          const keys = ["si:profile","si:portfolio","si:alerts","si:opps","si:chat","si:screen","si:tab"];
          await Promise.all(keys.map(k => window.storage.delete(k).catch(()=>{})));
        } catch {}
        _setProfile(null); _setPortfolio(PORTFOLIO_INIT); _setAlerts(ALERTS_INIT);
        _setOpps(OPPS_INIT); _setChatMsgs([]); _setScreen("landing"); _setTab("dashboard");
      }, []);

      return { dbReady, dbStatus, profile, setProfile, portfolio, setPortfolio, alerts, setAlerts, opps, setOpps, chatMsgs, setChatMsgs, screen, setScreen, tab, setTab, resetAll };
    }

    /* ═══════════════════════════════════════════════════════════
       NAVIGATION & LAYOUT
    ═══════════════════════════════════════════════════════════ */

    const AppNav = ({ tab, setTab, alerts, profile, dbStatus, onReset }) => {
      const unread = alerts.filter(a=>!a.read).length;
      const [showReset,setShowReset] = useState(false);
      const TABS = [{ id:"dashboard",l:"Dashboard",ic:"� �" },{ id:"portfolio",l:"Portfolio",ic:"� �" },{ id:"chat",l:"AI Chat",ic:"� �" },{ id:"radar",l:"Radar",ic:"� �" },{ id:"alerts",l:"Alerts",ic:"" }];
      return (
        <nav style={{ background:"#08111f",borderBottom:`1px solid ${T.border}`,padding:"0 24px",display:"flex",alignItems:"center",justifyContent:"space-between",height:60,position:"sticky",top:0,zIndex:100 }}>
          {showReset && (
            <div className="modal-overlay" onClick={()=>setShowReset(false)}>
              <div className="modal-box" style={{ fontFamily:"'Syne',sans-serif" }} onClick={e=>e.stopPropagation()}>
                <h2 style={{ color:"white",fontSize:18,fontWeight:700,fontFamily:"'Cormorant Garamond',serif",marginBottom:10 }}>Reset All Data?</h2>
                <p style={{ color:T.muted,fontSize:13,lineHeight:1.6,marginBottom:22 }}>This will permanently delete your profile, portfolio, alerts, watchlist and chat history.</p>
                <div style={{ display:"flex",gap:10 }}>
                  <button onClick={()=>setShowReset(false)} style={{ flex:1,padding:"11px",background:"transparent",border:`1px solid ${T.border}`,color:T.muted,borderRadius:9,fontSize:13,cursor:"pointer",fontFamily:"'Syne',sans-serif" }}>Cancel</button>
                  <button onClick={()=>{ onReset(); setShowReset(false); }} style={{ flex:1,padding:"11px",background:"rgba(239,68,68,.14)",border:`1px solid ${T.red}44`,color:T.red,borderRadius:9,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"'Syne',sans-serif" }}>Reset Everything</button>
                </div>
              </div>
            </div>
          )}
          <div style={{ display:"flex",alignItems:"center",gap:32 }}>
            <div style={{ display:"flex",alignItems:"center",gap:9 }}>
              <div style={{ width:28,height:28,background:`linear-gradient(135deg,${T.green},${T.blue})`,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:900,color:"white",fontFamily:"'Cormorant Garamond',serif" }}>₹</div>
              <span style={{ color:"white",fontWeight:800,fontSize:15,fontFamily:"'Cormorant Garamond',serif" }}>SmartInvestor<span style={{color:T.green}}>AI</span></span>
            </div>
            <div style={{ display:"flex",gap:4 }}>
              {TABS.map(t=>(
                <button key={t.id} className="tab-btn" onClick={()=>setTab(t.id)} style={{ background:tab===t.id?"rgba(16,185,129,.11)":"transparent",border:tab===t.id?`1px solid ${T.green}38`:"1px solid transparent",color:tab===t.id?T.green:T.muted,padding:"6px 14px",borderRadius:8,fontSize:13,cursor:"pointer",fontWeight:tab===t.id?600:400,fontFamily:"'Syne',sans-serif",position:"relative" }}>
                  {t.ic} {t.l}
                  {t.id==="alerts" && unread>0 && <span style={{ position:"absolute",top:2,right:4,background:T.red,color:"white",fontSize:8,fontWeight:700,width:14,height:14,borderRadius:"50%",display:"inline-flex",alignItems:"center",justifyContent:"center" }}>{unread}</span>}
                </button>
              ))}
            </div>
          </div>
          <div style={{ display:"flex",alignItems:"center",gap:10 }}>
            <DbBadge status={dbStatus}/>
            <div style={{ display:"flex",alignItems:"center",gap:6,background:"rgba(16,185,129,.06)",border:"1px solid rgba(16,185,129,.18)",borderRadius:16,padding:"4px 11px" }}>
              <div style={{ width:6,height:6,borderRadius:"50%",background:T.green,animation:"livePulse 2s infinite" }}/>
              <span style={{ color:T.green,fontSize:10,fontWeight:700,fontFamily:"'JetBrains Mono',monospace" }}>LIVE</span>
            </div>
            {profile && (
              <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                <div style={{ width:32,height:32,borderRadius:"50%",background:`linear-gradient(135deg,${T.green},${T.blue})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,color:"white",cursor:"pointer" }} onClick={()=>setShowReset(true)} title="Account settings">{profile.name.charAt(0)}</div>
                <span style={{ color:"white",fontSize:13,fontFamily:"'Syne',sans-serif" }}>{profile.name.split(" ")[0]}</span>
              </div>
            )}
          </div>
        </nav>
      );
    };

    /* ═══════════════════════════════════════════════════════════
       MAIN APP COMPONENT
    ═══════════════════════════════════════════════════════════ */

    function App() {
      const db = useDB();
      const { dbReady, dbStatus, profile, setProfile, portfolio, setPortfolio,
              alerts, setAlerts, opps, setOpps, chatMsgs, setChatMsgs,
              screen, setScreen, tab, setTab, resetAll } = db;

      if (!dbReady) return (
        <div style={{ minHeight:"100vh",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,fontFamily:"'Syne',sans-serif" }}>
          <div style={{ width:44,height:44,background:`linear-gradient(135deg,${T.green},${T.blue})`,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,color:"white",fontFamily:"'Cormorant Garamond',serif",boxShadow:`0 0 32px ${T.green}40` }}>₹</div>
          <div style={{ display:"flex",gap:6 }}>
            {[0,1,2].map(i=><div key={i} style={{ width:8,height:8,borderRadius:"50%",background:T.green,animation:"dotBounce 1.2s infinite",animationDelay:`${i*.2}s` }}/>)}
          </div>
          <p style={{ color:T.muted,fontSize:13 }}>Loading your data</p>
        </div>
      );

      const handleNavigate = (targetTab) => {
        setTab(targetTab);
        if (profile) setScreen("app");
        else setScreen("onboarding");
      };

      if (screen === "landing") return <Landing onEnter={()=>setScreen("onboarding")} onNavigate={handleNavigate}/>;
      if (screen === "onboarding" || !profile) return <Onboarding onComplete={p => { setProfile(p); setScreen("app"); }} onBack={() => setScreen("landing")}/>;

      const view = () => {
        switch(tab) {
          case "dashboard": return <Dashboard profile={profile} alerts={alerts} setTab={setTab} portfolio={portfolio}/>;
          case "portfolio":  return <Portfolio portfolio={portfolio} setPortfolio={setPortfolio}/>;
          case "chat":       return <Chat profile={profile} chatMsgs={chatMsgs} setChatMsgs={setChatMsgs}/>;
          case "radar":      return <Radar opps={opps} setOpps={setOpps} setTab={setTab}/>;
          case "alerts":     return <AlertsPage alerts={alerts} setAlerts={setAlerts}/>;
          default:           return <Dashboard profile={profile} alerts={alerts} setTab={setTab} portfolio={portfolio}/>;
        }
      };

      return (
        <div style={{ minHeight:"100vh",background:T.bg }}>
          <AppNav tab={tab} setTab={setTab} alerts={alerts} profile={profile} dbStatus={dbStatus} onReset={resetAll}/>
          <TickerStrip/>
          <main style={{ maxWidth:1200,margin:"0 auto" }}>{view()}</main>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════
       RENDER APPLICATION
    ═══════════════════════════════════════════════════════════ */

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
